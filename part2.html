<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at center, #1a1a2e, #0a0a1a);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(30, 58, 95, 0.4);
            border: 2px solid #e2b96f;
            border-radius: 15px;
            padding: 40px;
            max-width: 900px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(226, 185, 111, 0.2);
            position: relative;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #e2b96f;
            font-size: 1.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .header p {
            color: #b0c4de;
            font-size: 0.9em;
        }

        /* Progress Bar */
        .progress-container {
            margin-bottom: 30px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            color: #e2b96f;
            font-weight: bold;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background: rgba(15, 32, 64, 0.7);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #e2b96f;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #5cb87a, #4a9f6f);
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Exercise Container */
        .exercise-container {
            min-height: 450px;
            animation: fadeIn 0.5s ease-in;
        }

        .exercise-container.fade-out {
            animation: fadeOut 0.3s ease-out;
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
            }

            to {
                opacity: 0;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        /* EXERCISE TYPE BADGE */
        .exercise-badge {
            display: inline-block;
            background: #e2b96f;
            color: #0a0a1a;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 1em;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
            width: 100%;
        }

        /* ===== DRAG & DROP EXERCISE ===== */
        .dragdrop-wrapper {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .task-statement {
            background: rgba(15, 32, 64, 0.5);
            border: 2px solid #e2b96f;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            font-size: 1em;
            color: #e2b96f;
            font-weight: bold;
        }

        .dropzone-section {
            background: rgba(15, 32, 64, 0.5);
            border: 2px dashed #5cb87a;
            border-radius: 10px;
            padding: 20px;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .dropzone-section.drag-over {
            background: rgba(92, 184, 122, 0.2);
            border-color: #e2b96f;
            box-shadow: 0 0 15px rgba(92, 184, 122, 0.3);
        }

        .dropzone-section.filled {
            background: rgba(92, 184, 122, 0.2);
            border-color: #5cb87a;
            border-style: solid;
        }

        .dropped-answer {
            background: linear-gradient(135deg, #5cb87a, #4a9f6f);
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.9em;
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.3);
            transition: all 0.2s;
        }

        .dropped-answer:hover {
            background: linear-gradient(135deg, #4a9f6f, #3a8f5f);
            transform: scale(1.02);
        }

        .options-section {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }

        .draggable-option {
            background: linear-gradient(135deg, #5cb87a, #4a9f6f);
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            font-weight: bold;
            cursor: grab;
            user-select: none;
            border: 2px solid rgba(255, 255, 255, 0.3);
            transition: all 0.2s ease;
            flex: 0 1 calc(50% - 6px);
            text-align: center;
            min-height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .draggable-option:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 12px rgba(92, 184, 122, 0.4);
        }

        .draggable-option:active {
            cursor: grabbing;
            opacity: 0.8;
        }

        .draggable-option.dragging {
            opacity: 0.5;
        }

        .draggable-option.used {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* ===== LÜCKENÜBUNG EXERCISE ===== */
        .lueckenubung-wrapper {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .sentence-display {
            background: rgba(15, 32, 64, 0.5);
            border: 2px solid #e2b96f;
            border-radius: 10px;
            padding: 20px;
            font-size: 1.3em;
            color: #b0c4de;
            line-height: 1.8;
            text-align: center;
        }

        .sentence-display .luecke {
            background: linear-gradient(135deg, #5cb87a, #4a9f6f);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-weight: bold;
            display: inline-block;
            min-width: 100px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .input-field {
            padding: 12px 15px;
            background: rgba(15, 32, 64, 0.5);
            border: 2px solid #e2b96f;
            border-radius: 8px;
            color: #e2b96f;
            font-size: 1.1em;
            font-weight: bold;
            text-align: center;
            min-width: 150px;
            transition: all 0.2s ease;
        }

        .input-field:focus {
            outline: none;
            background: rgba(15, 32, 64, 0.8);
            box-shadow: 0 0 10px rgba(226, 185, 111, 0.3);
        }

        .input-field::placeholder {
            color: rgba(226, 185, 111, 0.5);
        }

        /* BUTTONS */
        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 0.9em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-check {
            background: linear-gradient(135deg, #5cb87a, #4a9f6f);
            color: white;
        }

        .btn-check:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(92, 184, 122, 0.4);
        }

        .btn-check:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-reset {
            background: rgba(226, 185, 111, 0.2);
            color: #e2b96f;
            border: 2px solid #e2b96f;
        }

        .btn-reset:hover {
            background: rgba(226, 185, 111, 0.3);
        }

        .btn-next {
            background: linear-gradient(135deg, #5cb87a, #4a9f6f);
            color: white;
        }

        .btn-next:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(92, 184, 122, 0.4);
        }

        .btn-nav {
            background: linear-gradient(135deg, #e2b96f, #d4a960);
            color: #0a0a1a;
            padding: 8px 10px;
            border: none;
            border-radius: 8px;
            font-size: 0.7em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-nav:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(226, 185, 111, 0.4);

        /* FEEDBACK */
        .feedback {
            text-align: center;
            padding: 5px;
            border-radius: 8px;
            margin-top: 10px;
            font-weight: bold;
            display: none;
            animation: slideDown 0.3s ease;
        }

        .feedback.show {
            display: block;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .feedback.correct {
            background: rgba(92, 184, 122, 0.3);
            color: #5cb87a;
            border: 2px solid #5cb87a;
        }

        .feedback.incorrect {
            background: rgba(220, 53, 69, 0.3);
            color: #ff6b6b;
            border: 2px solid #ff6b6b;

            padding: 40px;

            background: linear-gradient(135deg, #5cb87a, #4a9f6f);

        }

        @media (max-width: 768px) {
            .draggable-option {
                flex: 0 1 100%;
            }

            .container {
                padding: 20px;
            }

            .header h1 {
                font-size: 1.5em;
            }

            .input-field {
                min-width: 100%;
            }
        }
    </style>
</head>

        // Initialisiere den Tracker mit allen Aufgaben
        function initializeTracker() {
            DRAGDROP_POOL.forEach(task => usageTracker.dragDrop[task.id] = 0);
            LUECKENUBUNG_POOL.forEach(task => usageTracker.lueckenubung[task.id] = 0);

            // Lade gespeicherte Daten aus Browser-Speicher
            const saved = localStorage.getItem('vocabularyTracker');
            if (saved) {
                try {
                    usageTracker = JSON.parse(saved);
                } catch (e) {
                    console.log('Tracker-Daten konnten nicht geladen werden, starten mit Null');
                }
            }
        }

        // ===== HILFSFUNKTIONEN =====
        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function selectRandomItems(array, count) {
            const shuffled = shuffleArray(array);
            return shuffled.slice(0, count);
        }

        function selectRandomItemsBalanced(array, count, trackerType) {
            const tracker = trackerType === 'dragdrop' ?
                usageTracker.dragDrop : usageTracker.lueckenubung;

            // Sortiere Aufgaben nach Nutzungshäufigkeit (niedrig zuerst)
            const sorted = array.sort((a, b) => {
                const countA = tracker[a.id] || 0;
                const countB = tracker[b.id] || 0;
                return countA - countB;
            });

            // Wähle die am wenigsten genutzten Aufgaben
            const selected = sorted.slice(0, count);

            // ⭐ WICHTIG: Mische die ausgewählten Aufgaben!
            return shuffleArray(selected);
        }

        function createTaskSequence() {
            const dragDropTasks = selectRandomItemsBalanced(DRAGDROP_POOL,
                CONFIG.dragDropWeight, 'dragdrop');
            const lueckenTasks = selectRandomItemsBalanced(LUECKENUBUNG_POOL,
                CONFIG.lueckenWeight, 'lueckenubung');

            const allTasks = [...dragDropTasks, ...lueckenTasks];
            return shuffleArray(allTasks);
        }

        function setupDragDropListeners(task) {
            const dropzone = document.getElementById('dropzone');
            const options = document.querySelectorAll('.draggable-option');
            const btnCheck = document.getElementById('btn-check');
            const btnReset = document.getElementById('btn-reset');
            let selectedOption = null;

            options.forEach(option => {
                option.addEventListener('dragstart', (e) => {
                    e.dataTransfer.effectAllowed = 'move';
                    option.classList.add('dragging');
                    selectedOption = option.dataset.option;
                });

                option.addEventListener('dragend', (e) => {
                    option.classList.remove('dragging');
                });

                option.addEventListener('click', () => {
                    if (option.classList.contains('used')) return;
                    selectedOption = option.dataset.option;
                    updateDropzone(selectedOption, option);
                    btnCheck.disabled = false;
                });
            });

            dropzone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropzone.classList.add('drag-over');
            });

            dropzone.addEventListener('dragleave', () => {
                dropzone.classList.remove('drag-over');
            });

            dropzone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropzone.classList.remove('drag-over');
                if (selectedOption) {
                    updateDropzone(selectedOption);
                    btnCheck.disabled = false;
                }
            });

            function updateDropzone(answer, sourceElement = null) {
                dropzone.innerHTML = `<div class="dropped-answer" data-selected="${answer}">${answer}</div>`;
                dropzone.classList.add('filled');

                options.forEach(opt => {
                    if (opt.dataset.option === answer) {
                        opt.classList.add('used');
                    } else {
                        opt.classList.remove('used');
                    }
                });

                const droppedAnswer = dropzone.querySelector('.dropped-answer');
                droppedAnswer.addEventListener('click', () => {
                    options.forEach(opt => opt.classList.remove('used'));
                    dropzone.innerHTML = '<span style="color: #b0c4de;">Ziehe eine Option hier hin</span>';
                    dropzone.classList.remove('filled');
                    selectedOption = null;
                    btnCheck.disabled = true;
                });
            }

            btnCheck.addEventListener('click', () => {
                const feedback = document.getElementById('feedback');
                const selected = dropzone.querySelector('.dropped-answer');
                const userAnswer = selected ? selected.dataset.selected : null;

                if (userAnswer === task.richtigeAntwort) {
                    feedback.classList.add('correct', 'show');
                    feedback.textContent = '✓ Richtig!';
                    gameState.score++;
                    gameState.answered[gameState.currentTaskIndex] = true;
                } else {
                    feedback.classList.add('incorrect', 'show');
                    feedback.textContent = `✗ Falsch! Richtig: ${task.richtigeAntwort}`;
                    gameState.answered[gameState.currentTaskIndex] = false;
                }

                btnCheck.style.display = 'none';
                btnReset.textContent = 'Weiter →';
                btnReset.addEventListener('click', nextTask);
            });

            btnReset.addEventListener('click', () => {
                dropzone.innerHTML = '<span style="color: #b0c4de;">Ziehe eine Option hier hin oder klicke</span>';
                dropzone.classList.remove('filled');
                options.forEach(opt => opt.classList.remove('used'));
                selectedOption = null;
                btnCheck.disabled = true;
            });
        }

        function setupLueckenubungListeners(task) {
            const inputField = document.getElementById('user-input');
            const btnCheck = document.getElementById('btn-check');
            const btnReset = document.getElementById('btn-reset');
            const feedback = document.getElementById('feedback');

            inputField.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    btnCheck.click();
                }
            });

            btnCheck.addEventListener('click', () => {
                const userAnswer = inputField.value.trim().toLowerCase().replace(/\s+/g, '');
                const correctAnswers = task.loesungen.map(a => a.toLowerCase().replace(/\s+/g, ''));

                if (correctAnswers.includes(userAnswer)) {
                    feedback.classList.add('correct', 'show');
                    feedback.textContent = `✓ Richtig! ${task.erklaerung}`
                    gameState.score++;
                    gameState.answered[gameState.currentTaskIndex] = true;
                } else {
                    feedback.classList.add('incorrect', 'show');
                    feedback.textContent = `✗ Falsch! Richtig: ${task.loesungen.join(' / ')}`;
                    gameState.answered[gameState.currentTaskIndex] = false;
                }

                btnCheck.style.display = 'none';
                btnReset.textContent = 'Weiter →';
                btnReset.addEventListener('click', nextTask);
            });

            btnReset.addEventListener('click', () => {
                inputField.value = '';
                inputField.focus();
                feedback.classList.remove('correct', 'incorrect', 'show');
            });
        }

        function renderTask(task) {
            const container = document.getElementById('exercise-container');
            container.classList.add('fade-out');

            setTimeout(() => {
                container.classList.remove('fade-out');

                if (task.typ === 'dragdrop') {
                    renderDragDropExercise(task);
                } else if (task.typ === 'lueckenubung') {
                    renderLueckenubungExercise(task);
                }

                updateProgress();
            }, 300);
        }

        function updateProgress() {
            const progress = ((gameState.currentTaskIndex + 1) / CONFIG.totalTasks) * 100;
            document.getElementById('progress-fill').style.width = progress + '%';
            document.getElementById('progress-text').textContent =
                `Aufgabe ${gameState.currentTaskIndex + 1} von ${CONFIG.totalTasks}`;
            document.getElementById('score-text').textContent =
                `Punkte: ${gameState.score}`;
        }

        function nextTask() {
            // Aktualisiere Tracker für aktuelle Aufgabe
            const currentTask = gameState.tasks[gameState.currentTaskIndex];
            const tracker = currentTask.typ === 'dragdrop' ?
                usageTracker.dragDrop : usageTracker.lueckenubung;
            tracker[currentTask.id]++;

            // Speichere Tracker im Browser
            localStorage.setItem('vocabularyTracker', JSON.stringify(usageTracker));

            // Gehe zur nächsten Aufgabe
            gameState.currentTaskIndex++;
            if (gameState.currentTaskIndex >= CONFIG.totalTasks) {
                showVictoryScreen();
            } else {
                renderTask(gameState.tasks[gameState.currentTaskIndex]);
            }
        }

        function getLatinRating(percentage) {
            if (percentage === 100) return {
                rating: 'Perfectus!',
                emoji: '⭐⭐⭐'
            };
            if (percentage >= 90) return {
                rating: 'Excellens!',
                emoji: '⭐⭐'
            };
            if (percentage >= 80) return {
                rating: 'Bene!',
                emoji: '⭐'
            };
            if (percentage >= 70) return {
                rating: 'Satis!',
                emoji: '✓'
            };
            return {
                rating: 'Discendum est!',
                emoji: '✗'
            };
        }

        function showVictoryScreen() {
            const container = document.getElementById('exercise-container');
            const victoryContainer = document.getElementById('victory-container');

            // Speichere Tracker am Ende des Spiels
            localStorage.setItem('vocabularyTracker', JSON.stringify(usageTracker));

            container.style.display = 'none';
            victoryContainer.style.display = 'block';

            const percentage = Math.round((gameState.score / CONFIG.totalTasks) * 100);
            const {
                rating,
                emoji
            } = getLatinRating(percentage);

            let html = `
                <div class="victory-screen">
                    <h2>🎉 Spiel beendet!</h2>
                    <div class="score-summary">
                        Du hast <strong>${gameState.score} von ${CONFIG.totalTasks}</strong> Aufgaben richtig gelöst.
                    </div>
                    <div class="score-summary">
                        <strong>Erfolgsquote: ${percentage}%</strong>
                    </div>
                    <div class="rating">
                        ${emoji} ${rating}
                    </div>
            `;

            if (percentage === 100) {
                html += `<p style="color: #e2b96f; font-size: 1.1em; margin-top: 20px;">Perfekt! Du beherrschst das Lateinische meisterlich!</p>`;
            } else if (percentage >= 90) {
                html += `<p style="color: #5cb87a; font-size: 1.1em; margin-top: 20px;">Ausgezeichnet!</p>`;
            } else if (percentage >= 80) {
                html += `<p style="color: #5cb87a; font-size: 1.1em; margin-top: 20px;">Gut gemacht!</p>`;
            } else if (percentage >= 70) {
                html += `<p style="color: #b0c4de; font-size: 1.1em; margin-top: 20px;">Du machst Fortschritte!</p>`;
            } else {
                html += `<p style="color: #ff6b6b; font-size: 1.1em; margin-top: 20px;">Besser als nichts :) !</p>`;
            }

            html += `
                    <button class="btn-restart" onclick="location.reload()">🔄 Spiel neu starten</button>
                    <p>
                        <a href="Index.html" style="display: inline-block; margin-top: 10px;">
                        <button class="btn-nav">← zum Vokabeltraining</button>
                        </a>
                    </p>
                </div>
            `;

            victoryContainer.innerHTML = html;
        }

        // ===== SPIELSTART =====
        function initGame() {
            console.log('=== SPIEL INITIALISIERT ===');
            console.log('CONFIG:', CONFIG);

            // Initialisiere Tracker
            console.log('Rufe initializeTracker auf...');
            initializeTracker();
            console.log('usageTracker nach Init:', usageTracker);

            // Erstelle Aufgabensequenz
            console.log('Rufe createTaskSequence auf...');
            gameState.tasks = createTaskSequence();
            console.log('Anzahl Aufgaben:', gameState.tasks.length);
            console.log('Aufgaben:', gameState.tasks.map(t => ({
                id: t.id,
                typ: t.typ
            })));

            gameState.answered = new Array(CONFIG.totalTasks).fill(null);

            // Rendere erste Aufgabe
            console.log('Rendere erste Aufgabe:', gameState.tasks[0]);
            renderTask(gameState.tasks[0]);
            console.log('=== INITIALISIERUNG ABGESCHLOSSEN ===');
        }

        // Spiel beim Laden starten
        window.addEventListener('DOMContentLoaded', initGame);
    </script>
</body>

</html>
