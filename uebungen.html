<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vokabeltraining – Lateinübung</title>
    <style>
        /* ===== GLOBAL STYLES ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at center, #1a1a2e, #0a0a1a);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(30, 58, 95, 0.4);
            border: 2px solid #e2b96f;
            border-radius: 15px;
            padding: 40px;
            max-width: 900px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(226, 185, 111, 0.2);
            position: relative;
        }

        /* ===== HEADER ===== */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #e2b96f;
            font-size: 1.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .header p {
            color: #b0c4de;
            font-size: 0.9em;
        }

        /* ===== PROGRESS BAR ===== */
        .progress-container {
            margin-bottom: 30px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            color: #e2b96f;
            font-weight: bold;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background: rgba(15, 32, 64, 0.7);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #e2b96f;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #5cb87a, #4a9f6f);
            width: 0%;
            transition: width 0.3s ease;
        }

        /* ===== EXERCISE CONTAINER ===== */
        .exercise-container {
            min-height: 450px;
            animation: fadeIn 0.5s ease-in;
        }

        .exercise-container.fade-out {
            animation: fadeOut 0.3s ease-out;
        }

        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* ===== EXERCISE BADGE ===== */
        .exercise-badge {
            display: inline-block;
            background: #e2b96f;
            color: #0a0a1a;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 1em;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
            width: 100%;
        }

        /* ===== DRAG & DROP EXERCISE ===== */
        .dragdrop-wrapper {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .task-statement {
            background: rgba(15, 32, 64, 0.5);
            border: 2px solid #e2b96f;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            font-size: 1em;
            color: #e2b96f;
            font-weight: bold;
        }

        .dropzone-section {
            background: rgba(15, 32, 64, 0.5);
            border: 2px dashed #5cb87a;
            border-radius: 10px;
            padding: 20px;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .dropzone-section.drag-over {
            background: rgba(92, 184, 122, 0.2);
            border-color: #e2b96f;
            box-shadow: 0 0 15px rgba(92, 184, 122, 0.3);
        }

        .dropzone-section.filled {
            background: rgba(92, 184, 122, 0.2);
            border-color: #5cb87a;
            border-style: solid;
        }

        .dropped-answer {
            background: linear-gradient(135deg, #5cb87a, #4a9f6f);
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.9em;
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.3);
            transition: all 0.2s;
        }

        .dropped-answer:hover {
            background: linear-gradient(135deg, #4a9f6f, #3a8f5f);
            transform: scale(1.02);
        }

        .options-section {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }

        .draggable-option {
            background: linear-gradient(135deg, #5cb87a, #4a9f6f);
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            font-weight: bold;
            cursor: grab;
            user-select: none;
            border: 2px solid rgba(255, 255, 255, 0.3);
            transition: all 0.2s ease;
            flex: 0 1 calc(50% - 6px);
            text-align: center;
            min-height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .draggable-option:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 12px rgba(92, 184, 122, 0.4);
        }

        .draggable-option:active {
            cursor: grabbing;
            opacity: 0.8;
        }

        .draggable-option.dragging {
            opacity: 0.5;
        }

        .draggable-option.used {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* ===== LÜCKENÜBUNG EXERCISE ===== */
        .lueckenubung-wrapper {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .sentence-display {
            background: rgba(15, 32, 64, 0.5);
            border: 2px solid #e2b96f;
            border-radius: 10px;
            padding: 20px;
            font-size: 1.3em;
            color: #b0c4de;
            line-height: 1.8;
            text-align: center;
        }

        .sentence-display .luecke {
            background: linear-gradient(135deg, #5cb87a, #4a9f6f);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-weight: bold;
            display: inline-block;
            min-width: 100px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .input-field {
            padding: 12px 15px;
            background: rgba(15, 32, 64, 0.5);
            border: 2px solid #e2b96f;
            border-radius: 8px;
            color: #e2b96f;
            font-size: 1.1em;
            font-weight: bold;
            text-align: center;
            min-width: 150px;
            transition: all 0.2s ease;
        }

        .input-field:focus {
            outline: none;
            background: rgba(15, 32, 64, 0.8);
            box-shadow: 0 0 10px rgba(226, 185, 111, 0.3);
        }

        .input-field::placeholder {
            color: rgba(226, 185, 111, 0.5);
        }

        /* ===== BUTTONS ===== */
        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 0.9em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-check {
            background: linear-gradient(135deg, #5cb87a, #4a9f6f);
            color: white;
        }

        .btn-check:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(92, 184, 122, 0.4);
        }

        .btn-check:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-reset {
            background: rgba(226, 185, 111, 0.2);
            color: #e2b96f;
            border: 2px solid #e2b96f;
        }

        .btn-reset:hover {
            background: rgba(226, 185, 111, 0.3);
        }

        .btn-next {
            background: linear-gradient(135deg, #5cb87a, #4a9f6f);
            color: white;
        }

        .btn-next:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(92, 184, 122, 0.4);
        }

        .btn-nav {
            background: linear-gradient(135deg, #e2b96f, #d4a960);
            color: #0a0a1a;
            padding: 8px 10px;
            border: none;
            border-radius: 8px;
            font-size: 0.7em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-nav:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(226, 185, 111, 0.4);
        }

        /* ===== FEEDBACK ===== */
        .feedback {
            text-align: center;
            padding: 5px;
            border-radius: 8px;
            margin-top: 10px;
            font-weight: bold;
            display: none;
            animation: slideDown 0.3s ease;
        }

        .feedback.show {
            display: block;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .feedback.correct {
            background: rgba(92, 184, 122, 0.3);
            color: #5cb87a;
            border: 2px solid #5cb87a;
        }

        .feedback.incorrect {
            background: rgba(220, 53, 69, 0.3);
            color: #ff6b6b;
            border: 2px solid #ff6b6b;
        }

        /* ===== SELECTION SCREEN ===== */
        .selection-screen {
            text-align: center;
            padding: 20px 0;
            animation: fadeIn 0.5s ease-in;
        }

        .selection-screen h2 {
            color: #e2b96f;
            font-size: 1.3em;
            margin-bottom: 10px;
        }

        .selection-screen p {
            color: #b0c4de;
            font-size: 0.9em;
            margin-bottom: 25px;
        }

        .selection-group {
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin-bottom: 30px;
        }

        .selection-group label {
            color: #e2b96f;
            font-weight: bold;
            text-align: left;
            margin-bottom: 6px;
            display: block;
        }

        .selection-group select {
            width: 100%;
            padding: 10px 14px;
            background: rgba(15, 32, 64, 0.7);
            border: 2px solid #e2b96f;
            border-radius: 8px;
            color: #e2b96f;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
        }

        .selection-group select:focus {
            outline: none;
            box-shadow: 0 0 10px rgba(226, 185, 111, 0.3);
        }

        .btn-start {
            background: linear-gradient(135deg, #5cb87a, #4a9f6f);
            color: white;
            padding: 14px 40px;
            font-size: 1em;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(92, 184, 122, 0.4);
        }

        /* ===== VICTORY SCREEN ===== */
        .victory-screen {
            text-align: center;
            padding: 40px;
            animation: fadeIn 0.5s ease-in;
        }

        .victory-screen h2 {
            color: #e2b96f;
            font-size: 1.5em;
            margin-bottom: 20px;
        }

        .victory-screen .rating {
            font-size: 1.3em;
            color: #5cb87a;
            margin: 20px 0;
            font-weight: bold;
        }

        .victory-screen .score-summary {
            color: #b0c4de;
            font-size: 0.9em;
            margin: 20px 0;
        }

        .victory-screen .btn-restart {
            background: linear-gradient(135deg, #5cb87a, #4a9f6f);
            color: white;
            margin-top: 20px;
        }

        .victory-screen .btn-restart:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(92, 184, 122, 0.4);
        }

        /* ===== HILFE-BOX ===== */
        .hilfe-box {
            margin-top: 16px;
            padding: 16px;
            background: #f0f4ff;
            border: 2px solid #8899dd;
            border-radius: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }

        .overlay-option-btn {
            padding: 8px 18px;
            background: #fff;
            border: 2px solid #8899dd;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
        }

        .overlay-option-btn:hover {
            background: #ddeeff;
        }

        /* ===== RICHTIG-OVERLAY ===== */
        .overlay-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        .overlay-box {
            background: rgba(15, 32, 64, 0.97);
            border: 2px solid #5cb87a;
            border-radius: 15px;
            padding: 30px 40px;
            max-width: 480px;
            width: 90%;
            text-align: center;
            box-shadow: 0 8px 32px rgba(92, 184, 122, 0.3);
        }

        .overlay-title {
            color: #5cb87a;
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 16px;
        }

        .overlay-erklaerung {
            color: #b0c4de;
            font-size: 1em;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .btn-overlay-weiter {
            background: linear-gradient(135deg, #5cb87a, #4a9f6f);
            color: white;
            padding: 12px 32px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-overlay-weiter:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(92, 184, 122, 0.4);
        }

        /* ===== RESPONSIVE DESIGN ===== */
        @media (max-width: 768px) {
            .draggable-option {
                flex: 0 1 100%;
            }

            .container {
                padding: 20px;
            }

            .header h1 {
                font-size: 1.5em;
            }

            .input-field {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header mit Titel -->
        <div class="header">
            <h1>Lateinübung</h1>
        </div>

        <!-- Fortschrittsbalken -->
        <div class="progress-container">
            <div class="progress-info">
                <span id="progress-text">Aufgabe 1 von 10</span>
                <span id="score-text">Punkte: 0</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
        </div>

        <!-- Übungscontainer (dynamisch gefüllt) -->
        <div id="exercise-container" class="exercise-container"></div>

        <!-- Sieg-Bildschirm (versteckt) -->
        <div id="victory-container" style="display: none;"></div>
    </div>

    <script>
        // ===== KONFIGURATION =====
        const CONFIG = {
            totalTasks: 10,          // Gesamtanzahl der Aufgaben pro Spiel
            dragDropWeight: 5,       // Anzahl Drag & Drop Aufgaben
            lueckenWeight: 5        // Anzahl Lückenübungen
        };

        // ===== GAME STATE =====
        const gameState = {
            currentTaskIndex: 0,    // Aktuelle Aufgaben-Index
            score: 0,               // Aktueller Punktestand
            tasks: [],              // Aufgaben-Reihenfolge für dieses Spiel
            answered: []            // Array mit Boolean-Werten (richtig/falsch)
        };

        // ===== USAGE TRACKER (für balancierte Aufgabenauswahl) =====
        let usageTracker = {
            dragDrop: {},           // Nutztracking für Drag & Drop Aufgaben
            lueckenubung: {}        // Nutztracking für Lückenübungen
        };

        // ===== SELECTED POOLS (für Aufgabenauswahl) =====
        const selectedPools = {
            dragdrop: 'alle',       // Standard: alle Drag & Drop Serien
            lueckenubung: 'alle'    // Standard: alle Lückenübung Serien
        };

        // ===== AUFGABEN-POOLS (Beispiel-Daten – ersetze diese mit deinen eigenen Aufgaben!) =====
        const DRAGDROP_POOL = [
            {
                id: 'dd01_01',
                typ: 'dragdrop',
                aufgabe: 'Übersetze: "Der Hund bellt."',
                optionen: ['Canis latrat.', 'Canis currit.', 'Puer dormit.'],
                richtigeAntwort: 'Canis latrat.'
            },
            {
                id: 'dd01_02',
                typ: 'dragdrop',
                aufgabe: 'Übersetze: "Der Junge schläft."',
                optionen: ['Puer dormit.', 'Canis latrat.', 'Magister legit.'],
                richtigeAntwort: 'Puer dormit.'
            },
            {
                id: 'dd01_03',
                typ: 'dragdrop',
                aufgabe: 'Übersetze: "Der Lehrer liest."',
                optionen: ['Magister legit.', 'Puer dormit.', 'Canis latrat.'],
                richtigeAntwort: 'Magister legit.'
            }
        ];

        const LUECKENUBUNG_POOL = [
            {
                id: 'lu01_01',
                typ: 'lueckenubung',
                satz: 'Der Junge ____ ein Buch. (lesen)',
                loesungen: ['liest'],
                verb: 'lesen',
                erklaerung: 'Das Verb "lesen" wird im Präsens als "liest" konjugiert.'
            },
            {
                id: 'lu01_02',
                typ: 'lueckenubung',
                satz: 'Der Hund ____ laut. (bellen)',
                loesungen: ['bellt'],
                verb: 'bellen',
                erklaerung: 'Das Verb "bellen" wird im Präsens als "bellt" konjugiert.'
            },
            {
                id: 'lu01_03',
                typ: 'lueckenubung',
                satz: 'Die Lehrerin ____ Latein. (lehren)',
                loesungen: ['lehrt'],
                verb: 'lehren',
                erklaerung: 'Das Verb "lehren" wird im Präsens als "lehrt" konjugiert.'
            }
        ];

        // ===== HILFSFUNKTIONEN =====

        /**
         * Mischt ein Array zufällig.
         * @param {Array} array - Das zu mischende Array.
         * @returns {Array} - Das gemischte Array.
         */
        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        /**
         * Wählt zufällige Elemente aus einem Array aus.
         * @param {Array} array - Das Quell-Array.
         * @param {number} count - Anzahl der auszuwählenden Elemente.
         * @returns {Array} - Array mit zufälligen Elementen.
         */
        function selectRandomItems(array, count) {
            const shuffled = shuffleArray(array);
            return shuffled.slice(0, count);
        }

        /**
         * Wählt Aufgaben basierend auf Nutzungsstatistiken aus (balanciert).
         * @param {Array} array - Array mit Aufgaben.
         * @param {number} count - Anzahl der auszuwählenden Aufgaben.
         * @param {string} trackerType - Typ des Trackers ('dragdrop' oder 'lueckenubung').
         * @returns {Array} - Array mit ausgewählten Aufgaben.
         */
        function selectRandomItemsBalanced(array, count, trackerType) {
            const tracker = trackerType === 'dragdrop' ? usageTracker.dragDrop : usageTracker.lueckenubung;

            // Sortiere Aufgaben nach Nutzungshäufigkeit (niedrig zuerst)
            const sorted = array.sort((a, b) => {
                const countA = tracker[a.id] || 0;
                const countB = tracker[b.id] || 0;
                return countA - countB;
            });

            // Wähle die am wenigsten genutzten Aufgaben
            const selected = sorted.slice(0, count);

            // WICHTIG: Mische die ausgewählten Aufgaben!
            return shuffleArray(selected);
        }

        /**
         * Ermittelt verfügbare Präfixe (z.B. 'dd01', 'dd02') aus einem Aufgaben-Pool.
         * @param {Array} pool - Der Aufgaben-Pool.
         * @returns {Array} - Array mit einzigartigen Präfixen.
         */
        function getAvailablePrefixes(pool) {
            const prefixes = new Set();
            pool.forEach(task => {
                // Extrahiert z.B. 'dd01' aus 'dd01_03'
                const prefix = task.id.split('_')[0];
                prefixes.add(prefix);
            });
            return [...prefixes].sort();
        }

        // ===== AUFGABEN-SEQUENZ ERSTELLEN =====

        /**
         * Erstellt eine zufällige Aufgaben-Reihenfolge basierend auf den ausgewählten Pools.
         * @returns {Array} - Array mit gemischten Aufgaben (Drag & Drop + Lückenübungen).
         */
        function createTaskSequence() {
            // Filtere Aufgaben nach ausgewählten Pools
            const filteredDragDrop = selectedPools.dragdrop === 'alle'
                ? DRAGDROP_POOL
                : DRAGDROP_POOL.filter(task => task.id.startsWith(selectedPools.dragdrop + '_'));

            const filteredLuecken = selectedPools.lueckenubung === 'alle'
                ? LUECKENUBUNG_POOL
                : LUECKENUBUNG_POOL.filter(task => task.id.startsWith(selectedPools.lueckenubung + '_'));

            // Wähle Aufgaben aus (balanciert nach Nutzung)
            const dragDropTasks = selectRandomItemsBalanced(filteredDragDrop, CONFIG.dragDropWeight, 'dragdrop');
            const lueckenTasks = selectRandomItemsBalanced(filteredLuecken, CONFIG.lueckenWeight, 'lueckenubung');

            // Kombiniere und mische beide Aufgabentypen
            return shuffleArray([...dragDropTasks, ...lueckenTasks]);
        }

        // ===== RENDER-FUNKTIONEN =====

        /**
         * Rendert eine Drag & Drop Übung.
         * @param {Object} task - Die aktuelle Aufgabe.
         */
        function renderDragDropExercise(task) {
            const shuffledOptions = shuffleArray(task.optionen);
            let html = `
                <div class="dragdrop-wrapper">
                    <div class="task-statement">${task.aufgabe}</div>
                    <div class="dropzone-section" data-correct="${task.richtigeAntwort}">
                        <span style="color: #b0c4de;">Ziehe eine Option hier hin oder klicke auf sie!</span>
                    </div>
                    <div class="options-section" id="options-section">
            `;

            shuffledOptions.forEach((option, index) => {
                html += `
                    <div class="draggable-option" draggable="true" data-option="${option}">
                        ${option}
                    </div>
                `;
            });

            html += `
                    </div>
                    <div class="feedback" id="feedback"></div>
                    <div class="button-group">
                        <button class="btn-check" id="btn-check" disabled>Überprüfen</button>
                        <button class="btn-reset" id="btn-reset">Zurücksetzen</button>
                    </div>
                </div>
            `;

            document.getElementById('exercise-container').innerHTML = html;
            setupDragDropListeners(task);
        }

        /**
         * Rendert eine Lückenübung.
         * @param {Object} task - Die aktuelle Aufgabe.
         */
        function renderLueckenubungExercise(task) {
            let html = `
                <div class="exercise-badge">
                    <div style="font-weight: normal;">Setze ein:</div> ${task.verb}
                </div>
                <div class="lueckenubung-wrapper">
                    <div class="sentence-display">
                        ${task.satz.replace('____', '<span class="luecke">?</span>')}
                    </div>
                    <div class="input-group">
                        <input
                            id="user-input"
                            type="text"
                            placeholder="Antwort eingeben..."
                            class="input-field"
                        />
                    </div>
                    <div class="feedback" id="feedback"></div>
                    <div class="button-group">
            `;

            // Falls Optionen vorhanden sind, füge einen Hilfe-Button hinzu
            if (task.optionen) {
                html += `
                    <button class="btn-reset" id="btn-hilfe">Hilfe</button>
                    <button class="btn-check" id="btn-check">Überprüfen</button>
                `;
            } else {
                html += `
                    <button class="btn-reset" id="btn-reset">Zurücksetzen</button>
                    <button class="btn-check" id="btn-check">Überprüfen</button>
                `;
            }

            html += `
                    </div>
                </div>
            `;

            document.getElementById('exercise-container').innerHTML = html;
            setupLueckenubungListeners(task);
        }

        // ===== EVENT-LISTENER FÜR DRAG & DROP =====

        /**
         * Richtet Event-Listener für Drag & Drop Übungen ein.
         * @param {Object} task - Die aktuelle Aufgabe.
         */
        function setupDragDropListeners(task) {
            const dropzone = document.querySelector('.dropzone-section');
            const options = document.querySelectorAll('.draggable-option');
            const btnCheck = document.getElementById('btn-check');
            const btnReset = document.getElementById('btn-reset');
            const feedback = document.getElementById('feedback');
            let selectedOption = null;

            // Drag-Start: Markiere die Option als "dragend"
            options.forEach(option => {
                option.addEventListener('dragstart', (e) => {
                    selectedOption = e.target.dataset.option;
                    e.target.classList.add('dragging');
                    e.dataTransfer.setData('text/plain', selectedOption);
                });

                option.addEventListener('dragend', () => {
                    option.classList.remove('dragging');
                });

                // Klick auf Option: Füge sie direkt zur Dropzone hinzu
                option.addEventListener('click', () => {
                    if (!option.classList.contains('used')) {
                        updateDropzone(option.dataset.option, option);
                        btnCheck.disabled = false;
                    }
                });
            });

            // Dropzone-Events
            dropzone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropzone.classList.add('drag-over');
            });

            dropzone.addEventListener('dragleave', () => {
                dropzone.classList.remove('drag-over');
            });

            dropzone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropzone.classList.remove('drag-over');
                const data = e.dataTransfer.getData('text/plain');
                if (data) {
                    updateDropzone(data);
                    btnCheck.disabled = false;
                }
            });

            /**
             * Aktualisiert die Dropzone mit der ausgewählten Antwort.
             * @param {string} answer - Die ausgewählte Antwort.
             * @param {HTMLElement} sourceElement - Das Quell-Element (optional).
             */
            function updateDropzone(answer, sourceElement = null) {
                dropzone.innerHTML = `<div class="dropped-answer" data-selected="${answer}">${answer}</div>`;
                dropzone.classList.add('filled');

                options.forEach(opt => {
                    if (opt.dataset.option === answer) {
                        opt.classList.add('used');
                    } else {
                        opt.classList.remove('used');
                    }
                });

                // Klick auf die Antwort in der Dropzone: Zurücksetzen
                const droppedAnswer = dropzone.querySelector('.dropped-answer');
                droppedAnswer.addEventListener('click', () => {
                    options.forEach(opt => opt.classList.remove('used'));
                    dropzone.innerHTML = '<span style="color: #b0c4de;">Ziehe eine Option hier hin oder klicke</span>';
                    dropzone.classList.remove('filled');
                    selectedOption = null;
                    btnCheck.disabled = true;
                });
            }

            // Überprüfen-Button
            btnCheck.addEventListener('click', () => {
                const selected = dropzone.querySelector('.dropped-answer');
                const userAnswer = selected ? selected.dataset.selected : null;

                if (userAnswer === task.richtigeAntwort) {
                    feedback.classList.add('correct', 'show');
                    feedback.textContent = '✓ Richtig!';
                    gameState.score++;
                    gameState.answered[gameState.currentTaskIndex] = true;
                } else {
                    feedback.classList.add('incorrect', 'show');
                    feedback.textContent = `✗ Falsch! Richtig: ${task.richtigeAntwort}`;
                    gameState.answered[gameState.currentTaskIndex] = false;
                }

                btnCheck.style.display = 'none';
                btnReset.textContent = 'Weiter →';
                btnReset.onclick = nextTask;
            });

            // Zurücksetzen-Button
            btnReset.addEventListener('click', () => {
                dropzone.innerHTML = '<span style="color: #b0c4de;">Ziehe eine Option hier hin oder klicke</span>';
                dropzone.classList.remove('filled');
                options.forEach(opt => opt.classList.remove('used'));
                selectedOption = null;
                btnCheck.disabled = true;
                feedback.classList.remove('correct', 'incorrect', 'show');
            });
        }

        // ===== EVENT-LISTENER FÜR LÜCKENÜBUNG =====

        /**
         * Richtet Event-Listener für Lückenübungen ein.
         * @param {Object} task - Die aktuelle Aufgabe.
         */
        function setupLueckenubungListeners(task) {
            const inputField = document.getElementById('user-input');
            const btnCheck = document.getElementById('btn-check');
            const feedback = document.getElementById('feedback');

            // Falls Optionen vorhanden sind: Hilfe-Button
            if (task.optionen) {
                const btnHilfe = document.getElementById('btn-hilfe');
                btnHilfe.addEventListener('click', () => {
                    // Nur einmal öffnen
                    if (document.querySelector('.hilfe-box')) return;

                    const hilfeBox = document.createElement('div');
                    hilfeBox.className = 'hilfe-box';

                    task.optionen.forEach(opt => {
                        const btn = document.createElement('button');
                        btn.className = 'overlay-option-btn';
                        btn.textContent = opt;
                        btn.addEventListener('click', () => {
                            document.getElementById('user-input').value = opt;
                            hilfeBox.remove();
                        });
                        hilfeBox.appendChild(btn);
                    });

                    // Direkt nach dem Input-Feld einfügen
                    const input = document.getElementById('user-input');
                    input.parentNode.insertAdjacentElement('afterend', hilfeBox);
                });
            } else {
                // Zurücksetzen-Button (nur ohne Optionen)
                const btnReset = document.getElementById('btn-reset');
                btnReset.addEventListener('click', () => {
                    inputField.value = '';
                    inputField.focus();
                    feedback.classList.remove('correct', 'incorrect', 'show');
                });
            }

            // Enter-Taste: Überprüfen
            inputField.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') btnCheck.click();
            });

            // Überprüfen-Button
            btnCheck.addEventListener('click', () => {
                const userAnswer = inputField.value.trim().toLowerCase().replace(/\s+/g, '');
                const correctAnswers = task.loesungen.map(a => a.toLowerCase().replace(/\s+/g, ''));

                if (correctAnswers.includes(userAnswer)) {
                    // RICHTIG → Feedback-Overlay zeigen
                    gameState.score++;
                    gameState.answered[gameState.currentTaskIndex] = true;
                    btnCheck.style.display = 'none';

                    // Hilfe-/Reset-Button verstecken
                    const extraBtn = document.getElementById('btn-hilfe') || document.getElementById('btn-reset');
                    if (extraBtn) extraBtn.style.display = 'none';

                    const backdrop = document.createElement('div');
                    backdrop.className = 'overlay-backdrop';
                    backdrop.innerHTML = `
                        <div class="overlay-box">
                            <div class="overlay-title">✓ Richtig!</div>
                            <div class="overlay-erklaerung">${task.erklaerung || 'Weiter so!'}</div>
                            <button class="btn-overlay-weiter" id="btn-overlay-weiter">Weiter →</button>
                        </div>
                    `;

                    document.querySelector('.container').appendChild(backdrop);
                    document.getElementById('btn-overlay-weiter').addEventListener('click', () => {
                        document.querySelector('.container').removeChild(backdrop);
                        nextTask();
                    });

                } else {
                    // ✗ FALSCH → normales Inline-Feedback
                    feedback.classList.add('incorrect', 'show');
                    feedback.textContent = `✗ Falsch! Richtig: ${task.loesungen.join(' / ')}`;
                    gameState.answered[gameState.currentTaskIndex] = false;
                    btnCheck.style.display = 'none';

                    // Hilfe-/Reset-Button zu "Weiter" umfunktionieren
                    const extraBtn = document.getElementById('btn-hilfe') || document.getElementById('btn-reset');
                    if (extraBtn) {
                        extraBtn.textContent = 'Weiter →';
                        extraBtn.className = 'btn-next';

                        // Alle alten Listener entfernen durch cloneNode
                        const newBtn = extraBtn.cloneNode(true);
                        extraBtn.parentNode.replaceChild(newBtn, extraBtn);
                        newBtn.addEventListener('click', nextTask);
                    }
                }
            });
        }

        // ===== SPIEL-STEUERUNG =====

        /**
         * Rendert die aktuelle Aufgabe.
         * @param {Object} task - Die zu rendernde Aufgabe.
         */
        function renderTask(task) {
            const container = document.getElementById('exercise-container');
            container.classList.add('fade-out');

            setTimeout(() => {
                container.classList.remove('fade-out');
                if (task.typ === 'dragdrop') {
                    renderDragDropExercise(task);
                } else if (task.typ === 'lueckenubung') {
                    renderLueckenubungExercise(task);
                }
                updateProgress();
            }, 300);
        }

        /**
         * Aktualisiert den Fortschrittsbalken und die Anzeige.
         */
        function updateProgress() {
            const progress = ((gameState.currentTaskIndex + 1) / CONFIG.totalTasks) * 100;
            document.getElementById('progress-fill').style.width = `${progress}%`;
            document.getElementById('progress-text').textContent = `Aufgabe ${gameState.currentTaskIndex + 1} von ${CONFIG.totalTasks}`;
            document.getElementById('score-text').textContent = `Punkte: ${gameState.score}`;
        }

        /**
         * Wechselt zur nächsten Aufgabe oder zeigt den Sieg-Bildschirm.
         */
        function nextTask() {
            // Aktualisiere Tracker für aktuelle Aufgabe
            const currentTask = gameState.tasks[gameState.currentTaskIndex];
            const tracker = currentTask.typ === 'dragdrop'
                ? usageTracker.dragDrop
                : usageTracker.lueckenubung;
            tracker[currentTask.id] = (tracker[currentTask.id] || 0) + 1;

            // Speichere Tracker im Browser
            localStorage.setItem('vocabularyTracker', JSON.stringify(usageTracker));

            // Gehe zur nächsten Aufgabe
            gameState.currentTaskIndex++;

            if (gameState.currentTaskIndex >= CONFIG.totalTasks) {
                showVictoryScreen();
            } else {
                renderTask(gameState.tasks[gameState.currentTaskIndex]);
            }
        }

        /**
         * Ermittelt die Latein-Bewertung basierend auf der Punktzahl.
         * @param {number} percentage - Prozentsatz der richtigen Antworten.
         * @returns {Object} - Bewertung und Emoji.
         */
        function getLatinRating(percentage) {
            if (percentage === 100) return { rating: 'Perfectus!', emoji: '🌟🌟🌟' };
            if (percentage >= 90) return { rating: 'Excellens!', emoji: '🌟🌟' };
            if (percentage >= 80) return { rating: 'Bene!', emoji: '✓' };
            if (percentage >= 70) return { rating: 'Satis!', emoji: '✓' };
            return { rating: 'Discendum est!', emoji: '✗' };
        }

        /**
         * Zeigt den Sieg-Bildschirm mit der Zusammenfassung.
         */
        function showVictoryScreen() {
            const container = document.getElementById('exercise-container');
            const victoryContainer = document.getElementById('victory-container');

            // Speichere Tracker am Ende des Spiels
            localStorage.setItem('vocabularyTracker', JSON.stringify(usageTracker));

            container.style.display = 'none';
            victoryContainer.style.display = 'block';

            const percentage = Math.round((gameState.score / CONFIG.totalTasks) * 100);
            const { rating, emoji } = getLatinRating(percentage);

            let html = `
                <div class="victory-screen">
                    <h2>▶ Spiel beendet!</h2>
                    <div class="score-summary">
                        Du hast <strong>${gameState.score} von ${CONFIG.totalTasks}</strong> Aufgaben richtig gelöst.
                    </div>
                    <div class="score-summary">
                        <strong>Erfolgsquote: ${percentage}%</strong>
                    </div>
                    <div class="rating">
                        ${emoji} ${rating}
                    </div>
            `;

            if (percentage === 100) {
                html += `<p style="color: #e2b96f; font-size: 1.1em; margin-top: 20px;">Perfekt! Du beherrschst das Lateinische meisterlich!</p>`;
            } else if (percentage >= 90) {
                html += `<p style="color: #5cb87a; font-size: 1.1em; margin-top: 20px;">Ausgezeichnet!</p>`;
            } else if (percentage >= 80) {
                html += `<p style="color: #5cb87a; font-size: 1.1em; margin-top: 20px;">Gut gemacht!</p>`;
            } else if (percentage >= 70) {
                html += `<p style="color: #b0c4de; font-size: 1.1em; margin-top: 20px;">Du machst Fortschritte!</p>`;
            } else {
                html += `<p style="color: #ff6b6b; font-size: 1.1em; margin-top: 20px;">Besser als nichts :)</p>`;
            }

            html += `
                <button class="btn-restart" onclick="showSelectionScreen()">Spiel neu starten</button>
                <p>
                    <button class="btn-nav" onclick="showSelectionScreen()">← Neue Auswahl</button>
                </p>
            `;

            victoryContainer.innerHTML = html;
        }

        // ===== AUSWAHL-BILDSCHIRM =====

        /**
         * Zeigt den Auswahl-Bildschirm für die Aufgaben-Serien.
         */
        function showSelectionScreen() {
            // Victory-Container verstecken, falls sichtbar
            const victoryContainer = document.getElementById('victory-container');
            victoryContainer.style.display = 'none';
            victoryContainer.innerHTML = '';

            // Exercise-Container wieder einblenden
            const container = document.getElementById('exercise-container');
            container.style.display = 'block';

            // Progress-Bereich ausblenden
            document.querySelector('.progress-container').style.display = 'none';

            // Verfügbare Präfixe ermitteln
            const ddPrefixes = getAvailablePrefixes(DRAGDROP_POOL);
            const luPrefixes = getAvailablePrefixes(LUECKENUBUNG_POOL);

            /**
             * Erstellt die Optionen für die Dropdown-Menüs.
             * @param {Array} prefixes - Array mit Präfixen.
             * @param {string} selected - Aktuell ausgewähltes Präfix.
             * @returns {string} - HTML-Optionen.
             */
            const buildOptions = (prefixes, selected) => {
                // "Alle Serien"-Option zuerst
                let options = `<option value="alle" ${selected === 'alle' ? 'selected' : ''}>Alle Serien</option>`;
                prefixes.forEach(prefix => {
                    options += `<option value="${prefix}" ${selected === prefix ? 'selected' : ''}>Serie ${prefix}</option>`;
                });
                return options;
            };

            let html = `
                <div class="selection-screen">
                    <h2>Wähle die Aufgaben-Serien aus</h2>
                    <p>Wähle aus, welche Aufgaben-Serien du üben möchtest.</p>

                    <div class="selection-group">
                        <label for="select-dd">Drag & Drop:</label>
                        <select id="select-dd">
                            ${buildOptions(ddPrefixes, selectedPools.dragdrop)}
                        </select>
                    </div>

                    <div class="selection-group">
                        <label for="select-lu">Lückenübung:</label>
                        <select id="select-lu">
                            ${buildOptions(luPrefixes, selectedPools.lueckenubung)}
                        </select>
                    </div>

                    <button class="btn-start" id="btn-start-game">Übung starten ▶</button>
                </div>
            `;

            container.innerHTML = html;

            // Event-Listener für den Start-Button
            document.getElementById('btn-start-game').addEventListener('click', () => {
                selectedPools.dragdrop = document.getElementById('select-dd').value;
                selectedPools.lueckenubung = document.getElementById('select-lu').value;
                startGame();
            });
        }

        // ===== SPIEL-START =====

        /**
         * Startet das Spiel mit den ausgewählten Einstellungen.
         */
        function startGame() {
            // Progress-Bereich wieder einblenden
            document.querySelector('.progress-container').style.display = 'block';

            // Zustand zurücksetzen
            gameState.currentTaskIndex = 0;
            gameState.score = 0;
            gameState.tasks = [];
            gameState.answered = [];

            initializeTracker();
            gameState.tasks = createTaskSequence();
            gameState.answered = new Array(CONFIG.totalTasks).fill(null);

            renderTask(gameState.tasks[0]);
        }

        /**
         * Initialisiert den Usage-Tracker aus dem LocalStorage.
         */
        function initializeTracker() {
            const saved = localStorage.getItem('vocabularyTracker');
            if (saved) {
                try {
                    usageTracker = JSON.parse(saved);
                } catch (e) {
                    console.log('Tracker-Daten konnten nicht geladen werden, starten mit Null');
                }
            } else {
                usageTracker = { dragDrop: {}, lueckenubung: {} };
            }
        }

        /**
         * Initialisiert das Spiel beim Laden der Seite.
         */
        function initGame() {
            initializeTracker(); // Tracker schon hier laden (für Balancing)
            showSelectionScreen();
        }

        // Spiel beim Laden starten
        window.addEventListener('DOMContentLoaded', initGame);
    </script>
</body>
</html>
